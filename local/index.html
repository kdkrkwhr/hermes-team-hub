<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hermes-team-hub (local)</title>
  <style>
    :root {
      --bg:#0f1115; --panel:#181b22; --ink:#e6e6e6; --muted:#9aa0a8;
      --pm:#f4c430; --dev:#7ed957; --infra:#4aa3ff; --qa:#ff7a90; --ops:#c08bff; --line:#2a2f3a;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
      background:var(--bg); color:var(--ink); display:flex; flex-direction:column; min-height:100vh; }
    .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--panel);
      border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .topbar h1 { font-size:18px; margin:0; }
    .pill { font-size:11px; padding:1px 6px; border-radius:5px; background:#232733; color:var(--muted); }
    #nav { display:flex; gap:8px; flex-wrap:wrap; }
    .tab { background:#232733; color:var(--ink); border:1px solid var(--line); border-radius:8px;
      padding:8px 14px; cursor:pointer; font-size:14px; }
    .tab:hover { background:#2c313d; }
    .tab.active { background:#343b4a; border-color:#4a5570; }
    main { flex:1; padding:24px 20px; max-width:1000px; width:100%; margin:0 auto; }
    .view { display:none; }
    .view.active { display:block; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
    .row { border-bottom:1px solid var(--line); padding:8px 0; font-size:14px; }
    .row .m { color:var(--muted); font-size:12px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; margin-right:6px; }
    .badge.pm{background:var(--pm);color:#1a1300;} .badge.dev{background:var(--dev);color:#06210a;}
    .badge.infra{background:var(--infra);color:#001226;} .badge.qa{background:var(--qa);color:#2a0008;}
    .badge.ops{background:var(--ops);color:#19002e;}
    #refresh { position:fixed; right:20px; bottom:20px; background:#2c6e49; color:#fff; border:none;
      border-radius:50%; width:52px; height:52px; font-size:20px; cursor:pointer; }
    .foot { padding:12px 20px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); text-align:center; }
    #game-canvas { background:#181b22; border:1px solid var(--line); border-radius:8px; display:block; margin-top:8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>🍄 hermes-team-hub <span class="pill">LOCAL</span></h1>
    <nav id="nav">
      <button class="tab active" data-role="dashboard">📊 대시보드</button>
      <button class="tab" data-role="kanban">📋 칸반</button>
      <button class="tab" data-role="agents">🤖 봇</button>
      <button class="tab" data-role="coral">📡 무전</button>
      <button class="tab" data-role="game">🎮 게임</button>
    </nav>
  </header>

  <main id="content">
    <section id="view-dashboard" class="view active">
      <div class="card">
        <h3>팀 실시간 현황</h3>
        <p style="color:#9aa0a8">로컬 백엔드가 Hermes/칸반/봇/무전을 직접 읽습니다.</p>
        <div class="row">칸반 카드: <b id="k-count">…</b> 건</div>
        <div class="row">봇 프로필: <b id="a-count">…</b> / 5 로드됨</div>
        <div class="row">최근 무전: <b id="c-count">…</b> 건</div>
      </div>
    </section>

    <section id="view-kanban" class="view"><div class="card"><h3>📋 칸반</h3><div id="kanban-list" class="panel"></div></div></section>
    <section id="view-agents" class="view"><div class="card"><h3>🤖 봇 프로필</h3><div id="agent-list" class="panel"></div></div></section>
    <section id="view-coral" class="view"><div class="card"><h3>📡 Coral 무전 로그</h3><div id="coral-list" class="panel"></div></div></section>
    <section id="view-game" class="view">
      <div class="card">
        <h3>🎮 Canvas 무한 점프 러너 <span class="pill">Infra 안</span></h3>
        <p style="color:#9aa0a8">스페이스로 점프, 장애물 피하기. 외부 에셋 0, 최고점은 localStorage에 저장.</p>
        <canvas id="game-canvas" width="640" height="240"></canvas>
      </div>
    </section>
  </main>

  <button id="refresh" title="새로고침">⟳</button>
  <footer class="foot">로컬 실행형 · 백엔드: local/app.py · 데이터는 대장님 PC에서만</footer>

  <script src="/local/game.js"></script>
  <script>
    const BADGE = { pm:"pm", dev:"dev", infra:"infra", qa:"qa", ops:"ops" };
    function badge(role){ return '<span class="badge '+(BADGE[role]||'')+'">'+(role||'').toUpperCase()+'</span>'; }
    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function loadAll(){
      try {
        var [kb, ag, cr] = await Promise.all([
          fetch('/api/kanban').then(r=>r.json()),
          fetch('/api/agents').then(r=>r.json()),
          fetch('/api/coral').then(r=>r.json())
        ]);
        document.getElementById('k-count').textContent = kb.length;
        document.getElementById('a-count').textContent = ag.filter(a=>a.exists).length;
        document.getElementById('c-count').textContent = cr.length;

        document.getElementById('kanban-list').innerHTML = kb.map(r =>
          '<div class="row"><span class="m">'+r.status+'</span> '+badge(r.assignee)+' <b>'+esc(r.id)+'</b> '+esc(r.title)+'</div>'
        ).join('') || '<p style="color:#9aa0a8">없음</p>';

        document.getElementById('agent-list').innerHTML = ag.map(a =>
          '<div class="row">'+badge(a.role)+' '+(a.exists?'<span class="pill">OK</span>':'<span class="pill">누락</span>')+
          '<div class="m" style="margin-top:4px">'+esc(a.head||'')+'</div></div>'
        ).join('');

        document.getElementById('coral-list').innerHTML = cr.slice().reverse().map(r =>
          '<div class="row">'+badge(r.agent)+' <span class="m">'+esc(r.ts)+'</span> '+esc(r.thread)+'</div>'
        ).join('') || '<p style="color:#9aa0a8">무전 로그 없음 (Coral 세션 점검 필요)</p>';
      } catch(e){ console.error(e); }
    }

    document.getElementById('refresh').addEventListener('click', loadAll);
    document.querySelectorAll('#nav .tab').forEach(t=>t.addEventListener('click',()=>{
      document.querySelectorAll('#nav .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.getElementById('view-'+t.dataset.role).classList.add('active');
    }));
    loadAll();
    setInterval(loadAll, 30000);
  </script>
</body>
</html>
